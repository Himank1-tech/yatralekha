services:
  - type: web
    name: yatralekha-api
    env: node
    plan: free
    region: singapore
    buildCommand: pnpm install --prod=false && pnpm --filter @fleetpilot/db build && pnpm --filter @fleetpilot/api build
    startCommand: pnpm --filter @fleetpilot/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://web-phi-plum-44.vercel.app
      - key: GEMINI_API_KEY
        sync: false
