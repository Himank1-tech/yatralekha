name: 24/7 Render API Keep-Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Production API Health
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Render API
        run: |
          echo "Pinging YatraLekha Production API at https://yatralekha-api.onrender.com/api/v1/health..."
          curl -fsS --retry 3 --retry-delay 5 https://yatralekha-api.onrender.com/api/v1/health || exit 1
          echo "Render API is warm and responsive!"
